[package]
name = "xray_vulnerable"
version = "0.1.0"
description = "The vulnerable build behind the X-Ray demo — withdraw checks the address but not the signature"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "xray_vulnerable"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
