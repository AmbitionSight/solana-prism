[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

# Placeholder addresses. `anchor keys sync` rewrites both this file and
# declare_id! from target/deploy/<program>-keypair.json on the first build, so
# these do not need to be edited by hand — but a build IS required before
# either address means anything.
[programs.devnet]
xray_vulnerable = "11111111111111111111111111111111"
xray_fixed = "11111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
