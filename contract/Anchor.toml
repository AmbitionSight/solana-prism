[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

# The real addresses, written by `anchor keys sync` from
# target/deploy/<program>-keypair.json. Anchor derives `#[account]`'s Owner from
# declare_id!, so each of these has to match the keypair its program is built
# from — a placeholder here makes the runtime reject the vault account.
[programs.devnet]
prism_vulnerable = "7SdcJctnNWx1CPrfJr5MR8jWgDLtW173FoYyCm8rP8U2"
prism_fixed = "9CFbfwYirp1ZFfwA2fYKKaeVoYU9R3cKNBukvn8EayPq"

# Deployed and live. The build box reaches the cluster only through a reverse
# tunnel to the host's HTTP proxy (this network's DNS poisons *.solana.com), so
# deployment ran as `solana program deploy --url https://api.testnet.solana.com`
# with HTTPS_PROXY pointing at that tunnel.
[programs.testnet]
prism_vulnerable = "7SdcJctnNWx1CPrfJr5MR8jWgDLtW173FoYyCm8rP8U2"
prism_fixed = "9CFbfwYirp1ZFfwA2fYKKaeVoYU9R3cKNBukvn8EayPq"
# Lesson two: the protocol's two builds, and the attacker's tool. The same three
# addresses are written into each program's `declare_id!` — Anchor derives
# `#[account]`'s Owner from that, so a mismatch here makes the runtime reject the
# credit account.
prism_owner_vulnerable = "38hLgAJyNUnRiZvWVWAwTwt9cZMA6wzyPQm3QQDAdWJL"
prism_owner_fixed = "BC5AtnTTYDfhrhxfng7JPUfoVwvcnvPrzuQsE7HpQW93"
prism_counterfeit = "AKW7vUPNvueeG31GV7gRCRtPQyvsmvat4RnzjPXjxiHR"

# Plan C fallback: the same keypairs run against a local validator, which is how
# the four attack assertions were first proven before a public cluster was
# reachable.
[programs.localnet]
prism_vulnerable = "7SdcJctnNWx1CPrfJr5MR8jWgDLtW173FoYyCm8rP8U2"
prism_fixed = "9CFbfwYirp1ZFfwA2fYKKaeVoYU9R3cKNBukvn8EayPq"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "testnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
